<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ProxyForApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>ProxyForApp <span>0.6.0</span></h1>
                <p>Запуск выбранных Windows-приложений через прокси</p>
            </div>
            <div id="proxy-state" class="state">Прокси не проверен</div>
        </header>

        <section class="card proxy-card">
            <h2>Прокси</h2>
            <div class="row">
                <input id="proxy-url" type="password" placeholder="socks5://127.0.0.1:1080">
                <input id="device" type="text" placeholder="wintun://mytun">
                <button id="test-btn" class="primary">Тест</button>
            </div>
        </section>

        <section class="card apps-card">
            <div class="section-head">
                <h2>Приложения</h2>
                <div class="actions">
                    <button id="start-btn">Запустить прокси</button>
                    <button id="catalog-btn">Добавить из списка</button>
                    <button id="choose-btn">Выбрать .exe</button>
                    <button id="delete-btn">Удалить</button>
                </div>
            </div>
            <p>Двойной клик по ярлыку запускает приложение через сохранённый прокси.</p>
            <div id="apps-grid" class="apps-grid"></div>
        </section>

        <section class="console">
            <pre id="log-output"></pre>
        </section>
    </div>
    <div id="catalog-modal" class="modal hidden">
        <div class="modal-card">
            <div class="section-head">
                <h2>Добавить из списка</h2>
                <button id="close-catalog">Закрыть</button>
            </div>
            <div id="catalog-list" class="catalog-list"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
